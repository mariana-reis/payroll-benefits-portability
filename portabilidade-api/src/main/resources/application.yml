spring:
  application:
    name: portabilidade-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:portabilidade;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

central:
  base-url: ${CENTRAL_BASE_URL:http://localhost:4000}
  connect-timeout: ${CENTRAL_CONNECT_TIMEOUT:2s}
  read-timeout: ${CENTRAL_READ_TIMEOUT:5s}
  hmac-secret: ${CENTRAL_HMAC_SECRET}
  retry:
    max-attempts: ${CENTRAL_GET_RETRY_MAX_ATTEMPTS:3}
    initial-backoff: ${CENTRAL_GET_RETRY_INITIAL_BACKOFF:100ms}
    max-backoff: ${CENTRAL_GET_RETRY_MAX_BACKOFF:500ms}
    multiplier: ${CENTRAL_GET_RETRY_MULTIPLIER:2}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [correlationId=%X{correlationId:-}] %logger{36} - %msg%n"

info:
  app:
    name: ${spring.application.name}
    description: API de portabilidade de convenios
